<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="text/javascript">
var pg = 2;
var min = 2;
var max = 208;
var prefix = "";
var suffix = ".jpg";
function openBook() {
	var s = document.getElementById("slider");
	s.min = min;
	s.max = max;
	var hash = window.location.hash;
	if (hash) {
		pg = hash.substring(1) * 1;
	}
	s.value = pg;
	turnPage();
}
function next() {
	pg+=1;
	if (pg > max) {
		pg = max;
	} else {
		document.getElementById("slider").value = pg;
		turnPage();
	}
}
function prev() {
	pg-=1;
	if (pg < min) {
		pg = min;
	} else {
		document.getElementById("slider").value = pg;
		turnPage();
	}
}
function tap(e, w) {
	if (e.clientX < (w / 2)) {
		prev(e);
		return;
	} else {
		next(e);
		return;
	}
}
function showWait() {
	$.mobile.loading('show', {
		text: 'Идёт загрузка...',
		textVisible: true,
		theme: 'z',
		html: ""
	});
}
function hideWait() {
	$.mobile.loading('hide');
}
function slide(val) {
	pg = val * 1;
	turnPage();
}
function turnPage() {
	showWait();
	document.getElementById("pageA").src = prefix + pad0(pg) + suffix;
	//document.getElementById("pageB").src = prefix + pad0(pg + 1) + suffix;
}
function pad0(nr) {
	var a = nr;
	if (nr < 100) {
		a = "0" + a;
	}
	if (nr < 10) {
		a = "0" + a;
	}
	return a;
}
</script>
<link rel="stylesheet" href="http://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
<script src="http://code.jquery.com/jquery-1.11.3.min.js"></script>
<script src="http://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
<script>
$(document).on("pagecreate","#pageone",function(){
	openBook();
	$("#pageA").on("swiperight",function(){
	  prev();
	});
	$("#pageA").on("swipeleft",function(){
	  next();
	});
});
</script>
</head>
<body>

<div data-role="page" id="pageone">
  <div data-role="header">
    <h1>МАТЕМАТИКА, второй класс</h1>
  </div>

  <div data-role="main" class="ui-content">
	<div style="border-left: 1px solid; padding: 2px; float: left; height: 680px;" >
		<img id="pageA" src="" onclick="tap(event, this.width)" onload="hideWait()" width="100%" height="100%" />
	</div>
	<!--<div style="border-right: 1px solid; padding: 2px; float: left; height: 680px;">
		<img id="pageB" src="" onclick="next()" style="" />
	</div>-->
  </div>

  <div data-role="footer">
    <input id="slider" type="range" style="width: 100%" onchange="slide(this.value)" />
  </div>
</div> 

</body>
</html>
