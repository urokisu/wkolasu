<html>
<head>
<title>Тетрадь по математике 2</title>
<meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
<meta name="keywords" content="советский учебник, СССР, школа, математика, природоведение, русский язык, советские учебники, чтение">
	<meta name="description" content="Сетевой некоммерческий образовательный ресурс републикаций материалов из учебников советского периода">
<style type="text/css">
body {zoom: 120%;}
</style>
<script type="text/javascript">
var pg = 1;
var min = 1;
var max = 49;
var prefix = "";
var suffix = ".png";
function openBook() {
	var s = document.getElementById("slider");
	s.min = min;
	s.max = max;
	hashGo();
	s.value = pg;
}
function hashGo() {
	var hash = window.location.hash;
	if (hash) {
		pg = hash.substring(1) * 1;
	}
	turnPage();
}
function next() {
	pg+=2;
	if (pg > max) {
		pg = max;
	} else {
		document.getElementById("slider").value = pg;
		turnPage();
	}
}
function prev() {
	pg-=2;
	if (pg < min) {
		pg = min;
	} else {
		document.getElementById("slider").value = pg;
		turnPage();
	}
}
function slide(val) {
	pg = val * 1;
	turnPage();
}
function turnPage() {
	document.getElementById("pageA").src = prefix + (pg) + suffix;
	document.getElementById("pageB").src = prefix + (pg + 1) + suffix;
}
function pad0(nr) {
	var a = nr;
	if (nr < 100) {
		a = "0" + a;
	}
	if (nr < 10) {
		a = "0" + a;
	}
	return a;
}
</script>
</head>
<body onload="openBook()" onhashchange="hashGo()">
<div style="border-left: 1px solid; padding: 2px; float: left; height: 680px;">
	<img id="pageA" src="" onclick="prev()" height="680" />
</div>
<div style="border-right: 1px solid; padding: 2px; float: left; height: 680px;">
	<img id="pageB" src="" onclick="next()" height="680" />
</div>
<input id="slider" type="range" style="width: 100%" onchange="slide(this.value)" />
</body>
</html>
